name: Verificar publicadas (200 + PageSpeed movil)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 7 * * 1"   # lunes

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verificar_publicado.py
      - if: always()
        run: |
          git config user.name "calendarios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add informes/ && (git diff --cached --quiet || { git commit -m "Verificacion $(date -u +%F)"; git pull --rebase; git push; })
