name: Copia mensual de Blogger

on:
  schedule:
    - cron: "11 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/copia.py
      - run: |
          git config user.name "calendarios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/ && (git diff --cached --quiet || { git commit -m "Copia $(date -u +%Y-%m)"; git push; })
