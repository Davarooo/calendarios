name: Publicar en Blogger

on:
  schedule:
    - cron: "23 * * * *"   # una URL por hora como maximo; tope diario en TOPE_DIARIO
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pruebas y chequeos de calidad (si fallan, no se publica nada)
        run: |
          python -m unittest discover -s tests -v
          python scripts/generar.py 2027
          python scripts/chequeos.py
      - name: Espera aleatoria (separa las publicaciones entre 45 y 75 min)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 900 ))
      - name: Publicar siguiente URL
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          TOPE_DIARIO: "24"
        run: python scripts/publicar.py
      - name: Guardar cola
        if: always()
        run: |
          git config user.name "calendarios-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue.csv docs/
          git diff --cached --quiet || { git commit -m "Cola $(date -u +'%F %H:%M')"; git pull --rebase; git push; }
